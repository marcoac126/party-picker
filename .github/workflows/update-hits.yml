name: Update current lists

on:
  schedule:
    - cron: '17 11 * * 1'   # Mondays ~6:17 AM Central
  workflow_dispatch:        # lets Mark run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-hits.mjs
      - run: node scripts/update-books.mjs
      - run: node scripts/lookup-isbns.mjs
        continue-on-error: true   # a lookup problem should never block the weekly lists
      - name: Commit if a list changed
        run: |
          FILES="karaoke-song-picker/hits.js book-club-picker/current-books.js book-club-picker/isbns.js"
          touch book-club-picker/isbns.js
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard -- $FILES)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "list-updater"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          git commit -m "Update current lists"
          git push
