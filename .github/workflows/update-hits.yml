name: Update current hits

on:
  schedule:
    - cron: '17 11 * * 1'   # Mondays ~6:17 AM Central
  workflow_dispatch:        # lets Mark run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-hits.mjs
      - name: Commit if the list changed
        run: |
          if git diff --quiet -- karaoke-song-picker/hits.js; then
            echo "No change."
            exit 0
          fi
          git config user.name "hits-updater"
          git config user.email "actions@users.noreply.github.com"
          git add karaoke-song-picker/hits.js
          git commit -m "Update current hits"
          git push
